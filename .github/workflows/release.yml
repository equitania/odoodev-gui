name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    # tauri-action creates the GitHub Release and uploads assets via the
    # GITHUB_TOKEN. Repos default that token to read-only, which makes the
    # release-create call fail with "Resource not accessible by integration".
    # contents: write grants exactly the release/asset write scope it needs.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      # Actions are pinned to full commit SHAs: this job holds the updater signing
      # key and the Apple signing secrets, and a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      # No fallback to a plain `pnpm install`: the release must be built from
      # exactly the locked dependency versions.
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign / Ed25519). Required so tauri-action emits the
          # .sig files and latest.json the auto-updater verifies against the pubkey
          # in tauri.conf.json. Generate with `pnpm tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key was generated without a password, so no password env
          # is passed (an empty password matches the key). If you ever regenerate
          # the key WITH a password, add TAURI_SIGNING_PRIVATE_KEY_PASSWORD back.
          # macOS code signing + notarization (see docs/MACOS_SIGNING.md).
          # All six secrets must exist — an empty APPLE_CERTIFICATE makes
          # tauri-action attempt (and fail) the keychain import.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "odoodev-gui ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. Installed apps update themselves automatically on the next launch."
          # Must be published (not a draft): the updater resolves latest.json via
          # the /releases/latest/download/ URL, which ignores drafts.
          releaseDraft: false